<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f5f0e8;
    --surface: #ede7d9;
    --ink:     #2e2820;
    --ink2:    #7a6e60;
    --ink3:    #b0a696;
    --accent:  #8b7355;
    --accent2: #c4a882;
    --line:    rgba(46,40,32,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }
  header {
    text-align: center;
    margin-bottom: 64px;
  }
  header .eyebrow {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.65rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 10px;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: 0.04em;
    color: var(--ink);
    line-height: 1.1;
  }
  header h1 em { font-style: italic; color: var(--accent); }

  .block { width: 100%; max-width: 860px; }
  .block + .block {
    margin-top: 72px;
    padding-top: 72px;
    border-top: 1px solid var(--line);
  }
  .block-label {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.6rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 28px;
    text-align: center;
  }

  /* Daily */
  .daily-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #daily-sub {
    font-family: 'Jost', sans-serif;
    font-weight: 200;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink3);
  }
  #daily-message {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.6rem, 4.5vw, 2.8rem);
    letter-spacing: 0.03em;
    color: var(--ink);
    text-align: center;
    line-height: 1.3;
  }
  #daily-message span { color: var(--accent); }
  #daily-message.past { color: var(--ink2); }
  #daily-message.past span { color: var(--accent2); }

  /* Rings */
  .rings { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .ring-container { position: relative; width: 130px; height: 130px; }
  .ring-svg { width: 130px; height: 130px; transform: rotate(-90deg); }
  .ring-track { fill: none; stroke: var(--line); stroke-width: 1.5; }
  .ring-progress {
    fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linecap: butt;
    transition: stroke-dashoffset 0.95s cubic-bezier(0.4,0,0.2,1);
  }
  .ring-inner {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .ring-number {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300; font-size: 2.4rem;
    line-height: 1; color: var(--ink); letter-spacing: -0.01em;
  }
  .ring-unit {
    font-family: 'Jost', sans-serif; font-weight: 200;
    font-size: 0.55rem; letter-spacing: 0.35em;
    text-transform: uppercase; color: var(--ink3);
  }
  .ring-wrap:last-child .ring-number {
    animation: soft-pulse 1s ease-in-out infinite alternate;
  }
  @keyframes soft-pulse { from { opacity:1; } to { opacity:0.45; } }

  #arrived {
    display: none;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    color: var(--accent);
    text-align: center;
  }

  footer {
    margin-top: 80px;
    font-family: 'Jost', sans-serif; font-weight: 200;
    font-size: 0.6rem; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--ink3);
  }

  header, .block { animation: rise 1s ease both; }
  header { animation-delay: 0s; }
  .block:nth-of-type(1) { animation-delay: 0.15s; }
  .block:nth-of-type(2) { animation-delay: 0.3s; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }

  @media (max-width: 560px) {
    .ring-container { width:100px; height:100px; }
    .ring-svg { width:100px; height:100px; }
    .ring-number { font-size:1.8rem; }
    .rings { gap:12px; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">hang in there...</div>
  <h1>waiting for <em>THE DAY</em> </h1>
</header>

<div class="block">
  <div class="block-label">Until 17 : 30 today</div>
  <div class="daily-wrap">
    <div id="daily-sub">remaining</div>
    <div id="daily-message">—</div>
  </div>
</div>

<div class="block">
  <div class="block-label">Until 30 November</div>
  <div class="rings" id="rings-container">
    <div class="ring-wrap">
      <div class="ring-container">
        <svg class="ring-svg" viewBox="0 0 130 130">
          <circle class="ring-track" cx="65" cy="65" r="54"/>
          <circle class="ring-progress" id="ring-months" cx="65" cy="65" r="54" stroke-dasharray="339.29" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-inner"><span class="ring-number" id="val-months">—</span><span class="ring-unit">Months</span></div>
      </div>
    </div>
    <div class="ring-wrap">
      <div class="ring-container">
        <svg class="ring-svg" viewBox="0 0 130 130">
          <circle class="ring-track" cx="65" cy="65" r="54"/>
          <circle class="ring-progress" id="ring-days" cx="65" cy="65" r="54" stroke-dasharray="339.29" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-inner"><span class="ring-number" id="val-days">—</span><span class="ring-unit">Days</span></div>
      </div>
    </div>
    <div class="ring-wrap">
      <div class="ring-container">
        <svg class="ring-svg" viewBox="0 0 130 130">
          <circle class="ring-track" cx="65" cy="65" r="54"/>
          <circle class="ring-progress" id="ring-hours" cx="65" cy="65" r="54" stroke-dasharray="339.29" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-inner"><span class="ring-number" id="val-hours">—</span><span class="ring-unit">Hours</span></div>
      </div>
    </div>
    <div class="ring-wrap">
      <div class="ring-container">
        <svg class="ring-svg" viewBox="0 0 130 130">
          <circle class="ring-track" cx="65" cy="65" r="54"/>
          <circle class="ring-progress" id="ring-mins" cx="65" cy="65" r="54" stroke-dasharray="339.29" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-inner"><span class="ring-number" id="val-mins">—</span><span class="ring-unit">Mins</span></div>
      </div>
    </div>
    <div class="ring-wrap">
      <div class="ring-container">
        <svg class="ring-svg" viewBox="0 0 130 130">
          <circle class="ring-track" cx="65" cy="65" r="54"/>
          <circle class="ring-progress" id="ring-secs" cx="65" cy="65" r="54" stroke-dasharray="339.29" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-inner"><span class="ring-number" id="val-secs">—</span><span class="ring-unit">Secs</span></div>
      </div>
    </div>
  </div>
  <div id="arrived">The day has arrived.</div>
</div>

<footer>updated every second</footer>

<script>
  const CIRC = 2 * Math.PI * 54;
  function setRing(id, fraction) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.strokeDashoffset = CIRC * (1 - Math.min(1, Math.max(0, fraction)));
  }
  function updateDaily() {
    const now = new Date();
    const target = new Date(now);
    target.setHours(17, 30, 0, 0);
    const diff = target - now;
    const el = document.getElementById('daily-message');
    const sub = document.getElementById('daily-sub');
    if (diff <= 0) {
      el.className = 'past';
      sub.textContent = 'passed — next in';
      const next = new Date(target);
      next.setDate(next.getDate() + 1);
      const rem = next - now;
      const h = Math.floor(rem / 3600000);
      const m = Math.floor((rem % 3600000) / 60000);
      const s = Math.floor((rem % 60000) / 1000);
      el.innerHTML = `<span>${h}h</span> ${m}m ${s}s`;
    } else {
      el.className = '';
      sub.textContent = 'remaining';
      const h = Math.floor(diff / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      let out = '';
      if (h > 0) out += `<span>${h}</span> hour${h!==1?'s':''}  `;
      if (h > 0 || m > 0) out += `<span>${m}</span> minute${m!==1?'s':''}  `;
      out += `<span>${s}</span> second${s!==1?'s':''}`;
      el.innerHTML = out;
    }
  }
  function getTarget() {
    const now = new Date();
    let t = new Date(now.getFullYear(), 10, 30, 0, 0, 0, 0);
    if (t <= now) t = new Date(now.getFullYear() + 1, 10, 30, 0, 0, 0, 0);
    return t;
  }
  function updateEvent() {
    const now = new Date();
    const target = getTarget();
    const diff = target - now;
    if (diff <= 0) {
      document.getElementById('rings-container').style.display = 'none';
      document.getElementById('arrived').style.display = 'block';
      return;
    }
    let temp = new Date(now), months = 0;
    while (true) {
      const next = new Date(temp);
      next.setMonth(next.getMonth() + 1);
      if (next > target) break;
      months++; temp = next;
    }
    const rem = target - temp;
    const totalSecs = Math.floor(rem / 1000);
    const days  = Math.floor(totalSecs / 86400);
    const hours = Math.floor((totalSecs % 86400) / 3600);
    const mins  = Math.floor((totalSecs % 3600) / 60);
    const secs  = totalSecs % 60;
    document.getElementById('val-months').textContent = months;
    document.getElementById('val-days').textContent   = days;
    document.getElementById('val-hours').textContent  = hours;
    document.getElementById('val-mins').textContent   = String(mins).padStart(2,'0');
    document.getElementById('val-secs').textContent   = String(secs).padStart(2,'0');
    setRing('ring-months', months / 12);
    setRing('ring-days',   days   / 30);
    setRing('ring-hours',  hours  / 23);
    setRing('ring-mins',   mins   / 59);
    setRing('ring-secs',   secs   / 59);
  }
  function tick() { updateDaily(); updateEvent(); }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
